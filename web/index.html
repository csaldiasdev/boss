<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>boss</title>
    <!-- Rust 1.82+ emits bulk-memory and nontrapping-fptoint instructions by
         default; wasm-opt rejects them unless the features are enabled. -->
    <link
      data-trunk
      rel="rust"
      data-bin="boss"
      href="../crates/boss/Cargo.toml"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #14171b;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body></body>
</html>
