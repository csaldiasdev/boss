[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
# Not on crates.io yet; internal path deps carry no version requirement.
publish = false
edition = "2024"
rust-version = "1.85"
license = "CC0-1.0"
repository = "https://github.com/csaldiasdev/boss"

[workspace.dependencies]
bpmn-core = { path = "crates/bpmn-core" }
bpmn-xml = { path = "crates/bpmn-xml" }
bpmn-validate = { path = "crates/bpmn-validate" }
boss-mcp = { path = "crates/boss-mcp" }

iced = { version = "0.14", features = ["canvas", "advanced"] }
rfd = "0.17"
rmcp = { version = "3.5", default-features = false, features = [
  "server",
  "macros",
  "schemars",
  "transport-streamable-http-server",
] }
tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
smol_str = "0.3"
indexmap = "2"
thiserror = "2"
quick-xml = "0.42"
log = "0.4"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we deliberately opt out of:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
# Theme token structs are Copy and passed by value by design.
large_types_passed_by_value = "allow"

[profile.release]
lto = true
strip = true
