name: pages

# Manual-only for now: GitHub Pages needs a public repository (or a paid
# plan) to deploy, so the automatic trigger on main stays disabled until the
# repository goes public. Restore the push trigger then:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: build and deploy the web app
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm target and trunk
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install trunk --locked
      - name: Build
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
